{% extends "base.html" %}

{% block title %}Añadir película - CineFlask{% endblock %}

{% block content %}
<h1>Añadir nueva película</h1>

<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('add_movie') }}">
            <div class="mb-3">
                <label for="title" class="form-label">Título</label>
                <input type="text" id="title" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="director" class="form-label">Director</label>
                <input type="text" id="director" name="director" class="form-control">
            </div>
            <div class="mb-3">
                <label for="year" class="form-label">Año</label>
                <input type="number" id="year" name="year" class="form-control">
            </div>
            <div class="mb-3">
                <label for="genre" class="form-label">Género</label>
                <input type="text" id="genre" name="genre" class="form-control">
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Descripción</label>
                <textarea id="description" name="description" class="form-control" rows="4"></textarea>
            </div>
            <div class="mb-3">
                <label for="rating" class="form-label">Puntuación</label>
                <input type="number" id="rating" name="rating" class="form-control" min="0" max="10" step="0.1">
            </div>
            <div class="mb-3">
                <label for="poster_url" class="form-label">URL del póster</label>
                <input type="url" id="poster_url" name="poster_url" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Guardar película</button>
            <a href="{{ url_for('movies') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
